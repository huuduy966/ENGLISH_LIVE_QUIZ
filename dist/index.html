<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FDFBF7">
  <meta name="description" content="Đoán nghĩa từ tiếng Anh cùng TikTok LIVE">
  <title>English Live Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700&family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root{font-family:'DM Sans',sans-serif;color:#222b25;background:#FDFBF7;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input{font:inherit}button{cursor:pointer}.app{width:min(100%,480px);min-height:100dvh;margin:auto;padding:25px 22px 24px;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#FDFBF7}.app:before{content:"";position:absolute;width:270px;height:270px;border-radius:50%;background:#f6eedb;filter:blur(25px);top:92px;right:-180px;pointer-events:none}.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}.brand{font-size:12px;font-weight:800;letter-spacing:.18em}.live{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:#5b685e;background:#ecf3e7;border-radius:100px;padding:9px 12px}.dot{width:7px;height:7px;border-radius:50%;background:#7d9c67}.live.connected .dot{background:#ee6958;box-shadow:0 0 0 4px #ee695830}.eyebrow{margin:12px 0 6px;text-align:center;color:#8f987e;font-size:10px;font-weight:800;letter-spacing:.23em}.rule{text-align:center;font-size:13px;color:#69736b;margin:0 0 20px}.word-zone{text-align:center;position:relative;z-index:1}.word{font:700 clamp(58px,13vw,78px)/1.1 'Space Grotesk','DM Sans',sans-serif;letter-spacing:-.055em;color:#243d2e;margin:0;overflow-wrap:anywhere}.phonetic{margin:7px 0 0;font-size:13px;color:#84917d}.flower{position:absolute;right:12px;top:-16px;color:#dfb66e;font-size:27px;transform:rotate(20deg)}.answer-label{text-align:center;margin:30px 0 13px;font-size:10px;font-weight:800;color:#a2a995;letter-spacing:.2em}.tiles{display:flex;justify-content:center;gap:6px 18px;flex-wrap:wrap;min-height:48px}.tile-word{display:flex;gap:6px}.tile{width:39px;height:46px;display:grid;place-items:center;border:1.5px solid #d6dfcf;border-radius:10px;background:#f4f6ed;color:#365741;font-family:'Be Vietnam Pro','DM Sans',sans-serif;font-weight:700;font-size:22px;line-height:1.1;box-shadow:0 3px 0 #e4eadb}.tile.revealed{background:#dfebd7;animation:pop .25s ease both}@keyframes pop{50%{transform:translateY(-5px)}}.prompt{text-align:center;color:#8b9588;font-size:12px;margin:15px 0 0}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.section-title{font-family:'Manrope','DM Sans',sans-serif;font-size:11px;font-weight:800;letter-spacing:.09em;color:#53624f}.count{font-size:10px;color:#9aa49a}.activity{display:grid;grid-template-columns:42% 58%;gap:13px;margin-top:24px;min-height:230px;flex:1}.column{min-width:0}.column+.column{border-left:1px solid #e9e9dd;padding-left:13px}.medal{display:flex;align-items:center;gap:8px;margin:0 0 15px;min-width:0}.rank{width:21px;height:21px;display:grid;place-items:center;border-radius:7px;background:#edf0e6;color:#66775c;font-size:11px;font-weight:800;flex:none}.medal:first-child .rank{background:#f7e3ab;color:#9d6d20}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#dbe8d0;color:#52734e;font-size:12px;font-weight:800;flex:none}.person{min-width:0;flex:1}.person b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.person small{display:block;color:#9ba39a;font-size:10px}.points{font-size:13px;font-weight:800;color:#507458}.comment{display:flex;gap:8px;margin-bottom:8px;animation:slide .28s ease both}@keyframes slide{from{opacity:0;transform:translateY(8px)}}.comment .avatar{width:27px;height:27px;font-size:10px;background:#f0e7dd;color:#977356}.bubble{min-width:0}.bubble b{display:block;font-size:11px;color:#586658;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bubble p{margin:2px 0 0;font-size:12px;line-height:1.35;overflow-wrap:anywhere}.comment.correct .bubble p{color:#488052;font-weight:800}.empty{color:#abb3a7;font-size:11px;line-height:1.5}.win{position:absolute;top:41%;left:50%;transform:translate(-50%,-50%) scale(.85);z-index:5;background:#335941;color:white;box-shadow:0 16px 45px #29403238;border-radius:18px;padding:14px 22px;text-align:center;opacity:0;pointer-events:none;transition:.2s;min-width:195px}.win.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.win strong{display:block;font-size:15px}.win span{display:block;font-size:12px;margin-top:3px;color:#d8ead6}.footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #e7e8dc;padding-top:16px;margin-top:18px;gap:8px}.footer-note{font-size:10px;color:#a2aa9c}.round{font-size:11px;font-weight:800;color:#8a9d7f}.controls{display:flex;gap:7px}.control{border:0;border-radius:9px;background:#e9efdf;color:#426348;padding:8px 10px;font-size:11px;font-weight:800}.control.primary{background:#365a42;color:#fff}.host{margin-top:13px;padding:13px 0 0;border-top:1px dashed #e1e5d9}.host summary{font-size:11px;color:#869481;cursor:pointer}.host-inner{padding-top:12px}.host-row{display:flex;gap:7px;margin-bottom:8px}.host input{min-width:0;flex:1;border:1px solid #dce3d4;background:#fffefa;border-radius:9px;padding:10px;font-size:12px;outline-color:#8cab82}.host button{border:0;border-radius:9px;background:#4c7352;color:#fff;padding:0 12px;font-size:11px;font-weight:800}.host-help{color:#9ca89a;font-size:10px;line-height:1.5;margin:5px 0 0}.hidden{display:none!important}@media(min-height:850px){.eyebrow{margin-top:18px}.activity{margin-top:32px}}@media(max-width:370px){.app{padding-left:15px;padding-right:15px}.tile{width:34px;height:42px;font-size:20px}.activity{gap:8px}.column+.column{padding-left:9px}}
  </style>
  <style>.timer{display:flex;align-items:center;gap:12px;margin-top:18px}.timer-count{min-width:34px;color:#44694b;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}.timer-track{flex:1;height:6px;overflow:hidden;border-radius:99px;background:#e8eddf}.timer-progress{display:block;width:100%;height:100%;border-radius:99px;background:#83a873;transform-origin:left;will-change:transform}.timer.danger .timer-progress{background:#e49b73}.host-row.actions button{padding:9px 12px}.host-credit{margin:12px 0 0;color:#9ca89a;font-size:10px}.host-credit a{color:inherit;text-decoration:underline;text-underline-offset:2px}</style>
</head>
<body>
<main class="app">
  <p class="eyebrow">ENGLISH WORD CHALLENGE</p>
  <section class="word-zone" aria-live="polite"><span class="flower" aria-hidden="true">✳</span><h1 id="word" class="word">brave</h1><p id="phonetic" class="phonetic">/breɪv/</p></section>
  <p class="answer-label">ĐÁP ÁN</p><div id="tiles" class="tiles" aria-label="Các ô đáp án"></div><p id="prompt" class="prompt">Bạn biết từ này nghĩa là gì?</p>
  <div class="timer" aria-label="Thời gian còn lại"><span id="seconds" class="timer-count">15s</span><span class="timer-track"><span id="progress" class="timer-progress"></span></span></div>
  <div class="activity"><section class="column"><div class="section-head"><span class="section-title">🏆 BẢNG XẾP HẠNG</span></div><div id="leaders"></div></section><section class="column"><div class="section-head"><span class="section-title">BÌNH LUẬN</span><span id="comment-count" class="count">0</span></div><div id="comments"></div></section></div>
  <div id="win" class="win" role="status"><strong>✨ Chính xác!</strong><span id="winner"></span></div>
  <details id="host" class="host"><summary>Điều khiển cho chủ phòng</summary><div class="host-inner"><div class="host-row actions"><button id="reveal" type="button">Hiện đáp án</button><button id="next" type="button">Từ tiếp →</button></div><div class="host-row"><input id="username" autocomplete="off" placeholder="TikTok username, ví dụ @tenkenh" aria-label="TikTok username"><button id="connect" type="button">Kết nối</button></div><div class="host-row"><input id="tester" autocomplete="off" placeholder="Nhập bình luận để thử" aria-label="Bình luận thử"><button id="send" type="button">Gửi thử</button></div><p id="host-help" class="host-help">Mở bằng cầu nối trên máy livestream để nhận bình luận TikTok LIVE.</p><p class="host-credit">Từ điển: <a href="https://dict.minhqnd.com" target="_blank" rel="noopener">@minhqnd</a> · CC BY-SA 4.0</p></div></details>
</main>
<script type="module">
import { WORDS } from './words.js';
const $=id=>document.getElementById(id);
const normalize=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const saved=JSON.parse(localStorage.getItem('wordlive-leaders')||'{}');
const ROUND_MS=15000;
let leaders=saved,comments=[],round=1,current=WORDS[Math.floor(Math.random()*WORDS.length)],answered=new Set(),count=0,shown=false,audio,serverMode=false,startedAt=Date.now();
function renderWord(){ $('word').textContent=current.word;$('phonetic').textContent=current.phonetic;$('prompt').textContent='Bạn biết từ này nghĩa là gì?';$('tiles').replaceChildren(...current.answer.toUpperCase().trim().split(/\s+/).map(part=>{let group=document.createElement('span');group.className='tile-word';group.append(...[...part].map(letter=>{let el=document.createElement('span');el.className='tile';el.textContent=shown?letter:'';if(shown)el.classList.add('revealed');return el}));return group}));}
function nextLocal(){let choices=WORDS.filter(w=>w!==current);current=choices[Math.floor(Math.random()*choices.length)];round++;answered.clear();shown=false;startedAt=Date.now();renderWord()}
function tick(){let remaining=Math.max(0,ROUND_MS-(Date.now()-startedAt));$('seconds').textContent=Math.ceil(remaining/1000)+'s';$('progress').style.transform='scaleX('+(remaining/ROUND_MS)+')';document.querySelector('.timer').classList.toggle('danger',remaining<=5000);if(!serverMode&&remaining===0)nextLocal()}
function renderLeaders(){let list=Object.entries(leaders).sort((a,b)=>b[1].score-a[1].score||a[1].name.localeCompare(b[1].name)).slice(0,5);$('leaders').replaceChildren();if(!list.length){$('leaders').innerHTML='<p class="empty">Chưa có người ghi điểm.<br>Ai sẽ dẫn đầu?</p>';return}for(let i=0;i<list.length;i++){let [id,p]=list[i],row=document.createElement('div');row.className='medal';let rank=document.createElement('span');rank.className='rank';rank.textContent=i+1;let avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=p.name.slice(0,1).toUpperCase();let person=document.createElement('span');person.className='person';let name=document.createElement('b');name.textContent=p.name;let sub=document.createElement('small');sub.textContent='trả lời đúng';person.append(name,sub);let points=document.createElement('span');points.className='points';points.textContent=p.score;row.append(rank,avatar,person,points);$('leaders').append(row)}}
function renderComments(){ $('comment-count').textContent=String(count);$('comments').replaceChildren();if(!comments.length){$('comments').innerHTML='<p class="empty">Bình luận sẽ xuất hiện tại đây khi bắt đầu LIVE.</p>';return}for(let item of comments.slice(0,7)){let row=document.createElement('div');row.className='comment'+(item.correct?' correct':'');let avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=item.name.slice(0,1).toUpperCase();let bubble=document.createElement('div');bubble.className='bubble';let name=document.createElement('b');name.textContent=item.name;let message=document.createElement('p');message.textContent=item.message+(item.correct?' ✓':'');bubble.append(name,message);row.append(avatar,bubble);$('comments').append(row)}}
function ting(){try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();for(let [delay,freq] of [[0,880],[.11,1320]]){let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.currentTime+delay);g.gain.exponentialRampToValueAtTime(.16,audio.currentTime+delay+.015);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+delay+.24);o.connect(g).connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+.25)}}catch{}}
function submit(name,message,id=name){name=String(name||'Khách').slice(0,35);message=String(message||'').slice(0,180).trim();if(!message)return;id=String(id||name);let valid=[current.answer,...current.aliases].some(a=>normalize(a)===normalize(message));let correct=valid&&!answered.has(id)&&!shown&&Date.now()-startedAt<ROUND_MS;if(correct){answered.add(id);leaders[id]??={name,score:0};leaders[id].name=name;leaders[id].score++;localStorage.setItem('wordlive-leaders',JSON.stringify(leaders));ting();$('winner').textContent=name+' +1 điểm';$('win').classList.add('show');setTimeout(()=>$('win').classList.remove('show'),2500);renderLeaders()}comments.unshift({name,message,correct});count++;renderComments()}
function incoming(data){leaders=data.leaders;comments.unshift({name:data.name,message:data.message,correct:data.correct});count=data.count;if(data.correct){ting();$('winner').textContent=data.name+' +1 điểm';$('win').classList.add('show');setTimeout(()=>$('win').classList.remove('show'),2500)}renderLeaders();renderComments()}
const post=(path,data)=>fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)}).catch(e=>{$('host-help').textContent=e.message});
$('next').onclick=()=>{if(serverMode)post('/api/action',{action:'next'});else nextLocal()};
$('reveal').onclick=()=>{if(serverMode){post('/api/action',{action:'reveal'});return}shown=true;renderWord();$('prompt').textContent='Nghĩa là: '+current.answer};
$('send').onclick=()=>{let message=$('tester').value;if(serverMode)post('/api/test',{message});else submit('Bạn (thử)',message,'test');$('tester').value=''};
$('tester').onkeydown=e=>{if(e.key==='Enter')$('send').click()};
$('connect').onclick=async()=>{let username=$('username').value.trim().replace(/^@/,'');if(!username)return;localStorage.setItem('wordlive-username',username);$('host-help').textContent='Đang kết nối…';try{let res=await fetch('/api/connect',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username})});let data=await res.json();if(!res.ok)throw Error(data.error||'Không kết nối được');$('host-help').textContent='Đã yêu cầu kết nối @'+username+'. Hãy bắt đầu TikTok LIVE.'}catch(e){$('host-help').textContent='Cần chạy cầu nối trên máy livestream: '+e.message}};
$('username').value=localStorage.getItem('wordlive-username')||'';
if(location.search.includes('display=1'))$('host').classList.add('hidden');
try{let source=new EventSource('/api/events');source.onmessage=e=>{let data=JSON.parse(e.data);if(data.type==='game'){serverMode=true;current=WORDS[data.wordIndex];round=data.round;shown=data.shown;startedAt=data.startedAt;leaders=data.leaders;comments=data.comments;count=data.count;renderWord();if(shown)$('prompt').textContent='Nghĩa là: '+current.answer;renderLeaders();renderComments();tick()}if(data.type==='chat')incoming(data);if(data.type==='status'&&data.message)$('host-help').textContent=data.message};source.onerror=()=>{if(!serverMode)source.close()}}catch{}
renderWord();renderLeaders();renderComments();tick();setInterval(tick,80);
</script>
</body>
</html>
